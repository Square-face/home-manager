# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Format
format = """
$directory$git_branch\
$direnv$python$rust$golang$haskell$java$kotlin$lua$nix_shell$nodejs$package$perl$php$rlang$gradle$zig$swift$scala$ruby\
$fill$fill\
$git_status
($username([@](fg:#cdd6f4)$hostname) )\
$character"""
right_format = '''$time'''

palette = 'user'

[status]
disabled = false
symbol = '''[┌>](bold fg:col_abort)'''
success_symbol = '''[┌>](bold fg:col_success)'''
format = '$symbol'

[time]
format = '[$time]($style)'
style = 'fg:#7F8080'
disabled = false

[fill]
symbol = " "
style = 'black'

[character]
success_symbol = '''[󰅂](bold fg:col_success)'''
error_symbol = '''[󰅂](bold fg:col_abort)'''

[directory]
format = '''[$read_only]($style)[$path ]($style)'''
read_only = ''

[username]
disabled = false
style_user = "fg:#7f849c"
style_root = "fg:#eba0ac"
format = '[$user]($style)'

[hostname]
ssh_symbol = ""
style = "fg:#7f849c"
format = '[$hostname]($style)'
disabled = false

[palettes.user]
col_success="green"
col_abort="red"

[git_branch]
symbol = " "

